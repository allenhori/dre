name: Release

# Pushing a `v*` tag (e.g. `v0.0.1-alpha`) builds `dre` and every first-party plugin for each
# platform, publishes them as one GitHub Release, and adds the plugins to the registry index that
# `dre deps` and `dre init` read (the `index.json` asset of the `registry` release, see
# docs/registry.md). A tag with a pre-release suffix (`-alpha`, `-rc.1`) makes a pre-release.
#
# Assets, per platform (`<os>-<arch>` as in the index: macos-aarch64, linux-x86_64, ...):
#   dre-<version>-<platform>.tar.gz (.zip on Windows)    the dre CLI, for install.sh
#   dre-<kind>-<name>-<version>-<platform>.tar.gz        one plugin, for the registry
#   dre_cli-<pep440 version>-py3-none-<tag>.whl         the `dre-cli` wheels for PyPI
# plus SHA256SUMS and install.sh.
#
# PyPI: the `pypi` job builds the wheels from the same binaries and attaches them to the release.
# It uploads them to TestPyPI and then PyPI only when the repository variable PYPI_PUBLISH is
# `true`, through trusted publishing (no token): register this workflow (`release.yml`) as a
# trusted publisher for `dre-cli` on both indexes, with the environments `testpypi` and `pypi`.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, goos: darwin, goarch: arm64}
          # A macOS host cross-compiles to the other Mac architecture.
          - {platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, goos: darwin, goarch: amd64}
          # Ubuntu 22.04's glibc, so the binaries also run on older hosts such as Databricks
          # Runtime clusters (Ubuntu 22.04 up to DBR 16).
          - {platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64}
          - {platform: linux-aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, goos: linux, goarch: arm64}
          - {platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/databricks/go.mod
          cache-dependency-path: go/databricks/go.sum

      - name: Install OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dre-cli") | .version')"
          [[ "$version" == "$crate" ]] || { echo "tag $GITHUB_REF_NAME doesn't match the workspace version $crate"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build dre and the Rust plugins
        run: cargo build --release --locked --workspace --bins --target ${{ matrix.target }}

      # The Databricks adapter is one Go program, installed as both of its plugins.
      - name: Build the Databricks adapter
        shell: bash
        working-directory: go/databricks
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$RUNNER_TEMP/dre-source-databricks" .

      - name: Package
        shell: bash
        run: |
          ext=""; [[ "${{ runner.os }}" == Windows ]] && ext=".exe"
          bin="target/${{ matrix.target }}/release"
          cp "$RUNNER_TEMP/dre-source-databricks" "$bin/dre-source-databricks$ext"
          cp "$RUNNER_TEMP/dre-source-databricks" "$bin/dre-destination-databricks_volumes$ext"
          cp "$RUNNER_TEMP/dre-source-databricks" "$bin/dre-destination-databricks_workspace$ext"
          mkdir dist
          suffix="$VERSION-${{ matrix.platform }}"
          if [[ -n "$ext" ]]; then
            (cd "$bin" && 7z a -bd "$GITHUB_WORKSPACE/dist/dre-$suffix.zip" dre.exe >/dev/null)
          else
            tar -C "$bin" -czf "dist/dre-$suffix.tar.gz" dre
          fi
          for exe in "$bin"/dre-source-* "$bin"/dre-format-* "$bin"/dre-destination-*; do
            file="$(basename "$exe")"
            name="${file%$ext}"
            [[ "$file" == "$name$ext" && "$name" != *.d && "$name" != *-fixture ]] || continue
            tar -C "$bin" -czf "dist/$name-$suffix.tar.gz" "$file"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release and registry
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One registry update at a time: each one rewrites index.json.
    concurrency: registry
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          cp ../install.sh .
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          pre=(); [[ "$version" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${pre[@]}" --verify-tag \
            --title "DRE $GITHUB_REF_NAME" --generate-notes \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | sh\`"

      - name: Update the registry index
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view registry >/dev/null 2>&1; then
            gh release create registry --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Plugin registry" \
              --notes "The plugin index that \`dre deps\` and \`dre init\` read (index.json). See docs/registry.md. Not a release of DRE."
          fi
          gh release download registry -p index.json -D registry || true
          python3 .github/scripts/registry_index.py registry/index.json dist "$version" \
            "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME" > index.json
          gh release upload registry index.json --clobber

  pypi:
    name: PyPI wheels
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Build the wheels
        run: python3 .github/scripts/build_wheels.py --dist dist --version "${GITHUB_REF_NAME#v}" --out wheels

      - name: Smoke test the Linux wheel
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q wheels/*manylinux*_x86_64.whl
          /tmp/venv/bin/dre --version
          /tmp/venv/bin/python -m dre_cli plugin list

      - name: Attach the wheels to the release
        run: gh release upload "$GITHUB_REF_NAME" wheels/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheels/*.whl

  testpypi:
    name: Upload to TestPyPI
    needs: pypi
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels

  pypi-upload:
    name: Upload to PyPI
    needs: testpypi
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
