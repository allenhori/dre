name: Skills

# The agent skills in skills/ (see skills/README.md): their frontmatter and versions, the `dre`
# commands and flags they name (against the `dre` built here), the practices they cite, and that
# the shared snippets, the practices copy and the generated plugin references are up to date. It
# also fails when a plugin declares a field or option that docs/plugins.md doesn't document.
# .github/scripts/skills.py does the work. The skills release (skills-release.yml) runs it at the
# tag.

on:
  push:
    branches: [master]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "README.md"
      - "docs/**"
      - "crates/**"
      - "plugins/**"
      - "go/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/scripts/skills.py"
      - ".github/scripts/test_skills.py"
      - ".github/scripts/packages.json"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "README.md"
      - "docs/**"
      - "crates/**"
      - "plugins/**"
      - "go/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/scripts/skills.py"
      - ".github/scripts/test_skills.py"
      - ".github/scripts/packages.json"
      - ".github/workflows/skills.yml"
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Line tables only: backtraces keep file and line numbers, and the build cache is much smaller.
  # Set here rather than in Cargo.toml, so local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the checker
        run: python3 .github/scripts/test_skills.py
      - uses: dtolnay/rust-toolchain@stable
      # The same build as CI's Linux test job (`cargo build --workspace --bins`, same CARGO_*
      # variables), so restore that job's cache (its key is named after the job, `test`) and save
      # none of our own: the repo's caches have to fit in 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          shared-key: test
          save-if: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/databricks/go.mod
          cache-dependency-path: go/databricks/go.sum
      - name: Build dre and every plugin package
        run: |
          cargo build --locked --workspace --bins
          (cd go/databricks && go build -o ../../target/debug/dre-plugin-databricks .)
      - name: Check the skills
        run: python3 .github/scripts/skills.py check --dre target/debug/dre --plugins-dir target/debug
