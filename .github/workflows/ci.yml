name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  integration:
    # Plugin integration tests against local emulators of each service (Linux only: service
    # containers). Tests skip themselves when their service's env var is unset.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dre
          POSTGRES_PASSWORD: dre
          POSTGRES_DB: dre
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dre" --health-interval 5s --health-retries 20
    env:
      DRE_TEST_POSTGRES: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dre-source-postgres

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - run: cargo test --workspace
        env:
          DRE_TEST_PREBUILT_BINS: "1"
