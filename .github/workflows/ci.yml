name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  integration:
    # Plugin integration tests against local emulators (Linux only). Each test skips itself when
    # its service's env var is unset.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dre
          POSTGRES_PASSWORD: dre
          POSTGRES_DB: dre
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dre" --health-interval 5s --health-retries 20
      s3:
        image: adobe/s3mock
        ports: ["9090:9090"]
      mailpit:
        image: axllent/mailpit
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports: ["1025:1025", "8025:8025"]
    env:
      DRE_TEST_POSTGRES: localhost:5432
      DRE_TEST_S3_ENDPOINT: http://localhost:9090
      DRE_TEST_AZURITE_ENDPOINT: http://localhost:10000
      DRE_TEST_GCS_ENDPOINT: http://localhost:4443
      DRE_TEST_SFTP: localhost:2222
      DRE_TEST_FTP: 127.0.0.1:2121
      DRE_TEST_SMTP: localhost:1025
      DRE_TEST_MAILPIT_API: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - name: Start emulators that need arguments
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/id_test"
          echo "DRE_TEST_SFTP_KEY=$RUNNER_TEMP/id_test" >> "$GITHUB_ENV"
          docker run -d -p 4443:4443 fsouza/fake-gcs-server -scheme http -port 4443 \
            -public-host localhost:4443 -external-url http://localhost:4443
          docker run -d -p 2222:22 -v "$RUNNER_TEMP/id_test.pub:/home/dre/.ssh/keys/id_test.pub:ro" \
            atmoz/sftp dre:dre-pass:1001::upload
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          docker run -d -p 2121:21 -p 30000-30009:30000-30009 -e USERS="dre|dre-pass" \
            -e ADDRESS=127.0.0.1 -e MIN_PORT=30000 -e MAX_PORT=30009 delfer/alpine-ftp-server
          # Wait until each emulator answers, rather than a fixed sleep. A bare TCP connect isn't
          # enough: Docker's port proxy accepts on the host before the container listens, so read
          # each server's greeting (or make an HTTP request), and fail with its logs if it never
          # comes up.
          ready() {
            case $1 in
              2222) timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; read -r l <&3; [[ $l == SSH-* ]]' ;;
              2121) timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2121; read -r l <&3; [[ $l == 220* ]]' ;;
              *) curl -s -o /dev/null --max-time 2 "http://127.0.0.1:$1/" ;;
            esac
          }
          for port in 4443 2222 10000 2121; do
            for i in $(seq 60); do
              ready "$port" 2>/dev/null && break
              if [ "$i" = 60 ]; then
                echo "::error::emulator on port $port isn't ready after 60s"
                docker ps -a; docker logs "$(docker ps -aq --filter "publish=$port")"
                exit 1
              fi
              sleep 1
            done
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test --no-fail-fast -p dre-source-postgres -p dre-destination-object_store
          -p dre-destination-sftp -p dre-destination-ftp -p dre-destination-email

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      # Run every test binary even after a failure, so one failure can't hide others.
      - run: cargo test --workspace --no-fail-fast
        env:
          DRE_TEST_PREBUILT_BINS: "1"
