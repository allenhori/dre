name: CLA

# Asks every pull request author to sign CLA.md once, and fails until they have. Signatures are
# kept in signatures/cla.json on the `cla-signatures` branch, which must exist: the bot
# creates the file but not the branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # Runs no code from the pull request, so pull_request_target is safe here.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/allenhori/dre/blob/master/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: allenhori,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
