[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/get-dre/dre"
publish = false

[workspace.dependencies]
# DRE's own crates, published to crates.io. dre-core's version is DRE's (above; bump both
# together, release_plan.py checks it). dre-protocol has its own version.
dre-core = { path = "crates/dre-core", version = "=0.1.0-rc.1" }
dre-protocol = { path = "crates/dre-protocol", version = "0.1.0-rc.1" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", features = ["loader"] }
regex = "1"
chrono = "0.4"
chrono-tz = "0.10"
walkdir = "2"
semver = { version = "1", features = ["serde"] }
tempfile = "3"
assert_cmd = "2"
# Held at 58: the newest `duckdb` crate (1.10505) is built on arrow 58, and the DuckDB source
# passes record batches straight between the two. Bump together when duckdb moves.
arrow = "58"
parquet = "58"
duckdb = { version = "1.10505", features = ["bundled"] }
