[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/get-dre/dre"
publish = false

[workspace.dependencies]
# DRE's own crates, published to crates.io. dre-core's version is DRE's (above; bump both
# together, release_plan.py checks it). dre-protocol has its own version.
dre-core = { path = "crates/dre-core", version = "=0.1.1" }
dre-protocol = { path = "crates/dre-protocol", version = "0.1.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", features = ["loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
regex = "1"
chrono = "0.4"
chrono-tz = "0.10"
walkdir = "2"
semver = { version = "1", features = ["serde"] }
tempfile = "3"
assert_cmd = "2"
# Held at 58: the newest `duckdb` crate (1.10505) is built on arrow 58, and the DuckDB source
# passes record batches straight between the two. Bump together when duckdb moves.
arrow = "58"
parquet = "58"
duckdb = { version = "1.10505", features = ["bundled"] }

# Hashing and (un)gzipping run on whole plugin and `dre` binaries, which are tens of MB in a debug
# build (hundreds with full debug info on Linux). Unoptimised, that took seconds per install and
# per test; optimised, milliseconds. Release builds already optimise everything.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
