[package]
name = "dre-plugin-email"
description = "DRE destination plugin: send an output's files as email attachments over SMTP"
version = "1.0.0-alpha-1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dre-protocol = { path = "../../crates/dre-protocol" }
serde_json.workspace = true
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "native-tls"] }

[dev-dependencies]
tempfile.workspace = true
mail-parser = "0.11"
ureq = "3"
