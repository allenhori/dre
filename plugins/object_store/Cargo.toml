[package]
name = "dre-plugin-object_store"
description = "DRE destination plugins: S3, Google Cloud Storage and Azure Blob Storage"
version = "1.0.0-rc.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dre-protocol.workspace = true
serde_json.workspace = true
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
bytes = "1"
ureq = "3"
# AWS's own credential chain (profiles, SSO, credential_process, web identity, ECS/EC2), which
# object_store's `from_env` doesn't cover.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile.workspace = true
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
httpdate = "1"
