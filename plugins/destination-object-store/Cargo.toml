[package]
name = "dre-destination-object_store"
description = "DRE destination plugins: S3, Google Cloud Storage and Azure Blob Storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dre-protocol = { path = "../../crates/dre-protocol" }
serde_json.workspace = true
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
bytes = "1"
ureq = "3"

[dev-dependencies]
tempfile.workspace = true
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
httpdate = "1"
